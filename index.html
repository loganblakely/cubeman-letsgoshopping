<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | cubeman but small</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #231F20"></canvas>
    <script src="Build/webglshoup.loader.js"></script>

<script>
  const canvas = document.querySelector("#unity-canvas");
  const targetAspect = 16 / 9;

  function resizeCanvas() {
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;

    let canvasWidth = viewportWidth;
    let canvasHeight = viewportWidth / targetAspect;

    if (canvasHeight > viewportHeight) {
      canvasHeight = viewportHeight;
      canvasWidth = viewportHeight * targetAspect;
    }

    // Apply size
    canvas.style.width = `${canvasWidth}px`;
    canvas.style.height = `${canvasHeight}px`;

    // Center it
    canvas.style.position = "absolute";
    canvas.style.left = `${(viewportWidth - canvasWidth) / 2}px`;
    canvas.style.top = `${(viewportHeight - canvasHeight) / 2}px`;

    // Match internal resolution to displayed size
    const displayWidth = Math.floor(canvasWidth);
    const displayHeight = Math.floor(canvasHeight);

    if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
      canvas.width = displayWidth;
      canvas.height = displayHeight;
    }
  }

  // Run on load + resize
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  createUnityInstance(canvas, {
    dataUrl: "Build/webglshoup.data.unityweb",
    frameworkUrl: "Build/webglshoup.framework.js.unityweb",
    codeUrl: "Build/webglshoup.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "cubeman but small",
    productVersion: "0.1",
  });
</script>
  </body>
</html>
